# Google Cloud Build Configuration
# This file enables automated CI/CD deployment when you push to your repository

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sanjari-prints:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sanjari-prints:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sanjari-prints:$COMMIT_SHA'
    id: 'push-image-commit'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sanjari-prints:latest'
    id: 'push-image-latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sanjari-prints'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sanjari-prints:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL},VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY},VITE_RAZORPAY_KEY_ID=${_VITE_RAZORPAY_KEY_ID},VITE_PHONEPE_MERCHANT_ID=${_VITE_PHONEPE_MERCHANT_ID},VITE_APP_URL=${_VITE_APP_URL}'
    id: 'deploy-cloud-run'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/sanjari-prints:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sanjari-prints:latest'

# Substitution variables (configure these in Cloud Build Triggers)
substitutions:
  _REGION: 'asia-south1'
  _VITE_SUPABASE_URL: 'https://your-project.supabase.co'
  _VITE_SUPABASE_ANON_KEY: 'your-supabase-anon-key'
  _VITE_RAZORPAY_KEY_ID: 'rzp_test_your_key_id'
  _VITE_PHONEPE_MERCHANT_ID: 'your-phonepe-merchant-id'
  _VITE_APP_URL: 'https://your-domain.com'

# Build configuration
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout (default is 10 minutes)
timeout: '1200s'
