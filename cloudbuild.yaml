steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sanjari-app', '.']
    id: build

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sanjari-app']
    waitFor: ['build']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'sanjari-app'
    - '--image'
    - 'gcr.io/$PROJECT_ID/sanjari-app'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '80'
    - '--memory'
    - '1Gi'
    - '--timeout'
    - '300s'
    - '--set-env-vars'
    - 'NODE_ENV=production'
    waitFor: ['build']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/sanjari-app'